plugins {
    id 'java'
}

version = '1.0'
group = 'me.friendly.exeter.plugin'

base {
    archivesName = 'exeter-media-hud'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

repositories {
    mavenCentral()
}

def exeterJar = new File('C:/Users/orang/repos/meteor-autocart/meteor-addon-template/build/libs/exeter-1.0.jar')
def mcJar = new File('C:/Users/orang/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft/minecraft-merged-deobf/26.2/minecraft-merged-deobf-26.2.jar')

dependencies {
    compileOnly files(exeterJar, mcJar)
}

jar {
    from(sourceSets.main.output)
    from(configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) })
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

task copySmtc(type: Copy) {
    from('smtc-helper/smtc.exe')
    into('src/main/resources')
}

jar.dependsOn(copySmtc)
