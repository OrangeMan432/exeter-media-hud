plugins {
    id 'java'
}

version = '1.0'
group = 'me.friendly.exeter.plugin'

base {
    archivesName = 'exeter-media-hud'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

repositories {
    mavenCentral()
}

def exeterJar = new File('C:/Users/orang/repos/exeter/build/libs/exeter-1.0.jar')
def mcJar = new File('C:/Users/orang/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft/minecraft-merged-deobf/26.4-snapshot-1/minecraft-merged-deobf-26.4-snapshot-1.jar')

dependencies {
    compileOnly files(exeterJar, mcJar)
}

jar {
    from(sourceSets.main.output)
    from(configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) })
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def smtcFile = file('smtc-helper/smtc.exe')
task copySmtc(type: Copy) {
    onlyIf { smtcFile.exists() }
    from(smtcFile)
    into('src/main/resources')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processResources.dependsOn(copySmtc)
